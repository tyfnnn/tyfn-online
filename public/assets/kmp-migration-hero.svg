<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="KMP Migration — von Android über Kotlin Multiplatform zu iOS">
  <defs>
    <linearGradient id="kotlinGrad" x1="700" y1="240" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e44857"/>
      <stop offset=".5" stop-color="#c711e1"/>
      <stop offset="1" stop-color="#7f52ff"/>
    </linearGradient>
    <linearGradient id="kotlinSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e44857" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7f52ff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset=".5" stop-color="#c711e1"/>
      <stop offset="1" stop-color="#E6E6DD"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c711e1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c711e1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3a3a3a"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#2B2B2B"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect x="300" y="120" width="600" height="500" fill="url(#centerGlow)"/>

  <!-- frame edge accent -->
  <rect x="20" y="20" width="1160" height="590" rx="12" fill="none" stroke="#4A4A4A" stroke-width="1"/>

  <!-- Top-left: JetBrains 3-color brand stripe + wordmark -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="40" fill="#FF318C"/>
    <rect x="14" y="0" width="14" height="40" fill="#FCEE39"/>
    <rect x="28" y="0" width="14" height="40" fill="#21D789"/>
    <text x="58" y="28" font-family="'JetBrains Mono','Inter',sans-serif" font-size="20" font-weight="700" fill="#E6E6DD" letter-spacing="1.5">JetBrains</text>
  </g>

  <!-- Top-right: tag -->
  <g transform="translate(1140, 75)">
    <text font-family="'JetBrains Mono',monospace" font-size="14" fill="#B8B8B0" text-anchor="end" letter-spacing="3">COMPOSE  MULTIPLATFORM</text>
  </g>

  <!-- Title -->
  <text x="600" y="158" font-family="'Archivo Black','Inter',sans-serif" font-size="56" font-weight="900" fill="#E6E6DD" text-anchor="middle" letter-spacing="3">KMP MIGRATION</text>
  <text x="600" y="190" font-family="'JetBrains Mono',monospace" font-size="16" fill="#DB4A2B" text-anchor="middle" letter-spacing="6">NATIVE ANDROID  →  CROSSPLATTFORM</text>

  <!-- ============== Center icon row at y ≈ 370 ============== -->

  <!-- Android (left) -->
  <g transform="translate(220, 370)">
    <circle r="120" fill="#3DDC84" opacity=".06"/>
    <circle r="120" fill="none" stroke="#3DDC84" stroke-width="1" stroke-dasharray="3 5" opacity=".4"/>
    <!-- antennas -->
    <line x1="-22" y1="-72" x2="-12" y2="-50" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="-72" x2="12" y2="-50" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>
    <!-- head (half-stadium) -->
    <path d="M -55 -25 A 55 40 0 0 1 55 -25 L 55 35 L -55 35 Z" fill="#3DDC84"/>
    <!-- eyes -->
    <circle cx="-22" cy="-15" r="6" fill="#2B2B2B"/>
    <circle cx="22" cy="-15" r="6" fill="#2B2B2B"/>
    <!-- label -->
    <text y="100" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#E6E6DD" text-anchor="middle" letter-spacing="4">ANDROID</text>
    <text y="124" font-family="'JetBrains Mono',monospace" font-size="12" fill="#B8B8B0" text-anchor="middle" letter-spacing="2">jetpack compose</text>
  </g>

  <!-- Kotlin K (center) -->
  <g transform="translate(600, 370)">
    <!-- soft halo -->
    <circle r="190" fill="url(#kotlinSoft)"/>
    <circle r="170" fill="none" stroke="#c711e1" stroke-width="1" stroke-dasharray="2 6" opacity=".35"/>
    <!-- big K logo: official path scaled 2x and centered -->
    <g transform="translate(-128, -128) scale(2)">
      <path fill="url(#kotlinGrad)" d="M112.484 112.484H15.516V15.516h96.968L64 64Z"/>
    </g>
    <!-- label -->
    <text y="180" font-family="'Archivo Black','Inter',sans-serif" font-size="22" fill="#E6E6DD" text-anchor="middle" letter-spacing="6">KOTLIN</text>
    <text y="206" font-family="'JetBrains Mono',monospace" font-size="12" fill="#B8B8B0" text-anchor="middle" letter-spacing="2">multiplatform · shared UI</text>
  </g>

  <!-- iOS / Apple (right) -->
  <g transform="translate(980, 370)">
    <circle r="120" fill="#E6E6DD" opacity=".05"/>
    <circle r="120" fill="none" stroke="#E6E6DD" stroke-width="1" stroke-dasharray="3 5" opacity=".3"/>
    <!-- Apple logo (24x24 viewBox path), scaled & centered -->
    <g transform="translate(-65, -75) scale(5.6)">
      <path fill="#E6E6DD" d="M19.665 16.811a10.316 10.316 0 0 1-1.021 1.837c-.537.767-.978 1.297-1.316 1.592-.525.482-1.089.73-1.692.744-.432 0-.954-.123-1.562-.373-.61-.249-1.17-.371-1.683-.371-.537 0-1.113.122-1.73.371-.616.25-1.114.381-1.495.393-.577.025-1.154-.229-1.729-.764-.367-.32-.826-.87-1.377-1.648-.59-.829-1.075-1.794-1.455-2.891-.407-1.187-.611-2.335-.611-3.447 0-1.273.275-2.372.826-3.292a4.857 4.857 0 0 1 1.73-1.751 4.65 4.65 0 0 1 2.34-.66c.46 0 1.063.142 1.81.422s1.227.422 1.436.422c.158 0 .689-.167 1.593-.498.853-.307 1.573-.434 2.163-.384 1.6.129 2.801.759 3.6 1.895-1.43.867-2.137 2.08-2.123 3.637.012 1.213.453 2.222 1.317 3.023a4.33 4.33 0 0 0 1.315.863c-.106.307-.218.6-.336.882zM15.998 2.38c0 .95-.348 1.838-1.039 2.659-.836.976-1.846 1.541-2.941 1.452a2.955 2.955 0 0 1-.022-.36c0-.913.396-1.889 1.103-2.688.352-.404.8-.741 1.343-1.009.542-.264 1.054-.41 1.536-.435.014.121.02.243.02.381z"/>
    </g>
    <!-- label -->
    <text y="100" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#E6E6DD" text-anchor="middle" letter-spacing="6">iOS</text>
    <text y="124" font-family="'JetBrains Mono',monospace" font-size="12" fill="#B8B8B0" text-anchor="middle" letter-spacing="2">compose · uikit interop</text>
  </g>

  <!-- Migration flow line connecting Android → Kotlin → iOS -->
  <g transform="translate(0, 0)">
    <!-- left segment Android → Kotlin -->
    <path d="M 320 370 Q 460 330 410 370" fill="none" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
    <!-- visualize as a single sweeping curve under all three -->
    <path d="M 300 470 Q 600 540 900 470" fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
    <!-- arrowhead on right -->
    <path d="M 892 462 L 906 470 L 892 478" fill="none" stroke="#E6E6DD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- migration label centered above curve -->
    <g transform="translate(600, 558)">
      <rect x="-90" y="-22" width="180" height="32" rx="16" fill="#363636" stroke="#4A4A4A" stroke-width="1"/>
      <text font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#DB4A2B" text-anchor="middle" letter-spacing="6" y="-1">MIGRATION</text>
    </g>
  </g>

  <!-- Bottom corners -->
  <text x="60" y="595" font-family="'JetBrains Mono',monospace" font-size="12" fill="#4A4A4A" letter-spacing="2">// zentrik · android → kmp</text>
  <text x="1140" y="595" font-family="'JetBrains Mono',monospace" font-size="12" fill="#4A4A4A" text-anchor="end" letter-spacing="2">tyfn.online</text>
</svg>
