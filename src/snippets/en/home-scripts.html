<script>
  (function () {
    class Pixelate {
      constructor(img, opts) {
        this.img = img;
        this.amount = opts.amount || 0;
        this.canvas = document.createElement("canvas");
        this.ctx = this.canvas.getContext("2d");
        this.canvas.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;";
        img.parentNode.style.position = "relative";
        img.parentNode.appendChild(this.canvas);
        img.style.visibility = "hidden";
        this._resize();
        this.render();
      }
      _resize() {
        var r = window.devicePixelRatio || 1;
        var w = this.img.parentNode.clientWidth;
        var h = this.img.parentNode.clientHeight;
        this.canvas.width = w * r;
        this.canvas.height = h * r;
        this.ctx.scale(r, r);
        this.w = w;
        this.h = h;
      }
      setAmount(v) { this.amount = v; return this; }
      setWidth() { this._resize(); return this; }
      render() {
        var ctx = this.ctx, w = this.w, h = this.h, a = this.amount;
        ctx.clearRect(0, 0, w, h);
        if (a <= 0) {
          ctx.drawImage(this.img, 0, 0, w, h);
          return this;
        }
        var minBlock = 2, maxBlock = Math.min(w, h) * 0.12;
        var blockSize = Math.max(minBlock, Math.round(maxBlock * a));
        ctx.imageSmoothingEnabled = false;
        var sw = Math.max(1, Math.ceil(w / blockSize));
        var sh = Math.max(1, Math.ceil(h / blockSize));
        ctx.drawImage(this.img, 0, 0, sw, sh);
        ctx.drawImage(this.canvas, 0, 0, sw, sh, 0, 0, w, h);
        return this;
      }
    }

    $(".pixelate_wrapper").each(function () {
      var wrapper = this;
      var image = $(wrapper).find(".pixelate_image")[0];

      function init() {
        var pixelate = new Pixelate(image, { amount: 1 });
        var pixel = { value: 1 };

        gsap.to(pixel, {
          value: 0,
          duration: 2.4,
          delay: 1.2,
          ease: "steps(8)",
          onUpdate: function () {
            pixelate.setAmount(pixel.value).render();
          }
        });

        $(wrapper).on("mouseenter", function () {
          gsap.to(pixel, {
            value: 0,
            duration: 0.6,
            ease: "steps(4)",
            overwrite: true,
            onUpdate: function () {
              pixelate.setAmount(pixel.value).render();
            }
          });
        });

        $(wrapper).on("mouseleave", function () {
          gsap.to(pixel, {
            value: 0.85,
            duration: 0.5,
            ease: "steps(4)",
            overwrite: true,
            onUpdate: function () {
              pixelate.setAmount(pixel.value).render();
            }
          });
        });

        window.addEventListener("resize", function () {
          pixelate.setWidth().render();
        });
      }

      if (image.complete && image.naturalWidth > 0) {
        init();
      } else {
        image.addEventListener("load", init);
      }
    });
  })();
</script>
<script>
  // Split text into spans
  let typeSplit = new SplitType("[text-split]", {
    types: "chars",
    tagName: "span"
  });


  // Link timelines to scroll position
  function createScrollTrigger(triggerElement, timeline) {
    // Reset tl when scroll out of view past bottom of screen
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top bottom",
      onLeaveBack: () => {
        timeline.progress(0);
        timeline.pause();
      }
    });
    // Play tl when scrolled into view (60% from top of screen)
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top 80%",
      onEnter: () => timeline.play()
    });
  }


  $("[letters-fade-in-random]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { opacity: 0, duration: 0.8, ease: "power2.out", delay: 0.5, stagger: { amount: 0.6, from: "random" } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-slide-up]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { yPercent: 100, duration: 0.2, ease: "power2.out", stagger: { amount: 0.6 } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-footer]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { opacity: 0, duration: 0.8, ease: "power2.out", stagger: { amount: 0.6, from: "random" } });
    createScrollTrigger($(this), tl);
  });


  // Avoid flash of unstyled content
  gsap.set("[text-split]", { opacity: 1 });
</script>
<script async="">
  // Select all containers and buttons
  const containers = document.querySelectorAll('.home-work_video-wrapper');
  const buttons = document.querySelectorAll('.work_button-wrapper');

  // Iterate through each container
  containers.forEach((container, index) => {
    const button = buttons[index]; // Get the corresponding button

    // Add a mousemove event listener to the container
    container.addEventListener('mousemove', (event) => {
      // Calculate the position within the container
      const containerRect = container.getBoundingClientRect();
      const mouseX = event.clientX - containerRect.left;
      const mouseY = event.clientY - containerRect.top;

      // Calculate the button's position relative to the mouse position
      const buttonX = mouseX - button.offsetWidth / 2;
      const buttonY = mouseY - button.offsetHeight / 2;

      // Update the button's position
      button.style.transform = `translate(${buttonX}px, ${buttonY}px)`;
    });
  });
</script>

<script>
  $(window).bind("pageshow", function (event) {
    if (event.originalEvent.persisted) {
      window.location.reload()
    }
  });

  // Initialize Lenis smooth scroll
  const lenis = window.lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    orientation: 'vertical',
    gestureOrientation: 'vertical',
    smoothWheel: true,
    wheelMultiplier: 1,
    smoothTouch: false,
    touchMultiplier: 2,
    infinite: false,
  });

  // Get time for animation
  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  // Start smooth scroll
  requestAnimationFrame(raf);

  // Handle anchor links
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        lenis.scrollTo(target, {
          offset: 0,
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
      }
    });
  });
</script>
