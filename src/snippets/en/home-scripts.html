<script>
  $(".pixelate_wrapper").each(function (index) {
    let image = $(this).find(".pixelate_image")[0];
    let pixelate = new Pixelate(image, { amount: 1 }); // Set initial pixelation to 1

    let pixel = { value: 0.9 };

    $(this).on("mouseenter", function () {
      let tl = gsap.timeline({
        onUpdate: () => {
          pixelate.setAmount(pixel.value).render();
        },
        defaults: {
          delay: 0.15
        },
        ease: "power2.out"
      });

      // Gradually change the pixel value from the initial value to 0.97
      tl.set(pixel, { value: 0.97, delay: 0.2 }); // Pixel value 0.97 with a delay of 0.15s
      tl.set(pixel, { value: 0.95, delay: 0.2 }); // Pixel value 0.86 with a delay of 0.15s
      tl.set(pixel, { value: 0, delay: 0.2 });    // Pixel value 0 with a delay of 0.15s

      tl.play(); // Start the timeline animation
    });

    $(this).on("mouseleave", function () {
      let tl = gsap.timeline({
        onUpdate: () => {
          pixelate.setAmount(pixel.value).render();
        },
        defaults: {
          delay: 0.15
        },
        ease: "power2.out"
      });

      // Gradually change the pixel value from 0 back to the initial value (0.9)
      tl.set(pixel, { value: 0, delay: 0.15 }); // Pixel value 0.97 with a delay of 0.15s
      tl.set(pixel, { value: 0.95, delay: 0.15 }); // Pixel value 0.86 with a delay of 0.15s
      tl.set(pixel, { value: 0.97, delay: 0.15 });    // Pixel value 0 with a delay of 0.15s


      tl.play(); // Start the timeline animation
    });

    window.addEventListener("resize", function () {
      pixelate.setWidth(image.parentNode.clientWidth).render();
    });
  });
</script>
<script>
  // Split text into spans
  let typeSplit = new SplitType("[text-split]", {
    types: "chars",
    tagName: "span"
  });


  // Link timelines to scroll position
  function createScrollTrigger(triggerElement, timeline) {
    // Reset tl when scroll out of view past bottom of screen
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top bottom",
      onLeaveBack: () => {
        timeline.progress(0);
        timeline.pause();
      }
    });
    // Play tl when scrolled into view (60% from top of screen)
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top 80%",
      onEnter: () => timeline.play()
    });
  }


  $("[letters-fade-in-random]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { opacity: 0, duration: 0.8, ease: "power2.out", delay: 0.5, stagger: { amount: 0.6, from: "random" } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-slide-up]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { yPercent: 100, duration: 0.2, ease: "power2.out", stagger: { amount: 0.6 } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-footer]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { opacity: 0, duration: 0.8, ease: "power2.out", stagger: { amount: 0.6, from: "random" } });
    createScrollTrigger($(this), tl);
  });


  // Avoid flash of unstyled content
  gsap.set("[text-split]", { opacity: 1 });
</script>
<script async="">
  // Select all containers and buttons
  const containers = document.querySelectorAll('.home-work_video-wrapper');
  const buttons = document.querySelectorAll('.work_button-wrapper');

  // Iterate through each container
  containers.forEach((container, index) => {
    const button = buttons[index]; // Get the corresponding button

    // Add a mousemove event listener to the container
    container.addEventListener('mousemove', (event) => {
      // Calculate the position within the container
      const containerRect = container.getBoundingClientRect();
      const mouseX = event.clientX - containerRect.left;
      const mouseY = event.clientY - containerRect.top;

      // Calculate the button's position relative to the mouse position
      const buttonX = mouseX - button.offsetWidth / 2;
      const buttonY = mouseY - button.offsetHeight / 2;

      // Update the button's position
      button.style.transform = `translate(${buttonX}px, ${buttonY}px)`;
    });
  });
</script>

<script>
  $(window).bind("pageshow", function (event) {
    if (event.originalEvent.persisted) {
      window.location.reload()
    }
  });

  // Initialize Lenis smooth scroll
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    orientation: 'vertical',
    gestureOrientation: 'vertical',
    smoothWheel: true,
    wheelMultiplier: 1,
    smoothTouch: false,
    touchMultiplier: 2,
    infinite: false,
  });

  // Get time for animation
  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  // Start smooth scroll
  requestAnimationFrame(raf);

  // Handle anchor links
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        lenis.scrollTo(target, {
          offset: 0,
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
      }
    });
  });
</script>
