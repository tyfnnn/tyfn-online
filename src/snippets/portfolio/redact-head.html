    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Redact brand palette — mirrors src/styles/tokens.css of the
               Redact website, which in turn mirrors the app's asset catalog
               (AccentColor, BackgroundTop/Bottom, CardBackground). Warm cream
               surface + terracotta accent; the light appearance is the app's
               default identity, so the portfolio page commits to it. */
            --bg:           #FBF5EE;      /* BackgroundTop */
            --bg-grad-b:    #F3E4DC;      /* BackgroundBottom */
            --bg-elev:      #F8EFE7;
            --bg-card:      #FCF8F4;      /* CardBackground */

            --ink:          #33241C;      /* warm near-black */
            --ink-strong:   #241811;
            --ink-dim:      #6E5B4F;
            --ink-mute:     #A18A7B;

            --accent:       #C96F4A;      /* terracotta — AccentColor */
            --accent-soft:  #E5906B;
            --accent-deep:  #9C4F2E;
            --accent-glow:  rgba(201, 111, 74, 0.35);
            --accent-tint:  rgba(201, 111, 74, 0.07);
            --on-accent:    #FFF9F4;

            --rule:         rgba(51, 36, 28, 0.12);
            --rule-strong:  rgba(51, 36, 28, 0.26);

            --shadow-card:  0 1px 2px rgba(51, 36, 28, 0.05), 0 12px 32px -16px rgba(51, 36, 28, 0.18);
            --shadow-pop:   0 2px 4px rgba(51, 36, 28, 0.06), 0 24px 56px -20px rgba(51, 36, 28, 0.28);
            --shadow-shot:  0 4px 12px rgba(51, 36, 28, 0.06), 0 32px 72px -28px rgba(51, 36, 28, 0.32);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;

            /* Inter carries display + body (like the app UI); JetBrains Mono
               stays for labels, numbers and meta — the technical voice. */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

            /* Aliases consumed by the shared PortfolioNav component. */
            --bg-primary:   var(--bg);
            --card-bg:      var(--bg-card);
            --border-color: var(--rule);
            --border-strong: var(--rule-strong);
            --text-light:   var(--ink);
            --text-strong:  var(--ink-strong);
            --text-secondary: var(--ink-dim);
            --text-mute:    var(--ink-mute);
            --accent-color: var(--accent);

            color-scheme: light;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* The app's cream gradient, plus a faint terracotta warmth up top. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(60rem 34rem at 18% -8%, var(--accent-tint), transparent 62%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-grad-b) 100%);
        }

        main, header, footer, section { position: relative; z-index: 1; }

        /* PortfolioNav keeps its own typography (Inter + Archivo Black). */
        .pnav, .pnav-back, .pnav-lang { font-family: var(--font-sans); }
        .pnav-logo { font-family: 'Archivo Black', sans-serif; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ── Status chip ───────────────────────────────────────────── */
        .project-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-tint);
            color: var(--accent-deep);
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(201, 111, 74, 0.28);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .project-status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .hero-badge { margin-bottom: 1.5rem; }

        /* ── Hero ──────────────────────────────────────────────────── */
        .hero {
            padding: 5rem 0 3rem;
            text-align: center;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin-bottom: 2rem;
        }

        .hero-eyebrow::before {
            content: "";
            width: 28px;
            height: 2px;
            border-radius: 1px;
            background: var(--accent);
        }

        .hero-title {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: clamp(3rem, 10vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: -0.045em;
            color: var(--ink-strong);
            margin-bottom: 1.25rem;
        }

        .hero-title .accent {
            color: var(--accent);
            display: inline-block;
        }

        .hero-subtitle {
            font-size: 1.0625rem;
            color: var(--ink-dim);
            margin: 0 auto 2.5rem;
            max-width: 60ch;
            line-height: 1.7;
        }

        .hero-subtitle em {
            font-style: normal;
            color: var(--accent-deep);
            font-weight: 600;
        }

        /* ── Hero shot — the real app, on the app's own surface ────── */
        .hero-shot {
            position: relative;
            margin: 3rem auto 0;
            max-width: 1080px;
        }

        /* Kein CSS-Schatten: das Mac-Mockup bringt seinen eigenen mit. */
        .hero-shot img {
            display: block;
            width: 100%;
            height: auto;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.75rem;
            margin-top: 2rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-mute);
        }

        .hero-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero-meta span::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 2.5rem;
        }

        .hero-tag {
            background: var(--bg-card);
            color: var(--ink-dim);
            padding: 0.45rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--rule);
        }

        .hero-tag.primary {
            background: var(--accent-tint);
            color: var(--accent-deep);
            border-color: rgba(201, 111, 74, 0.28);
        }

        /* ── Project Info ──────────────────────────────────────────── */
        .project-info {
            padding: 4.5rem 0;
            border-top: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .info-section h3,
        .project-details h3 {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--ink-strong);
        }

        .info-section p {
            color: var(--ink-dim);
            margin-bottom: 1.5rem;
            line-height: 1.75;
        }

        .highlight {
            color: var(--accent-deep);
            font-weight: 600;
        }

        .project-details {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--rule);
            box-shadow: var(--shadow-card);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--rule);
            gap: 1rem;
        }

        .detail-item:last-child { border-bottom: none; }

        .detail-label {
            font-family: var(--font-mono);
            font-weight: 500;
            color: var(--ink);
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .detail-value {
            color: var(--ink-dim);
            text-align: right;
            font-size: 0.875rem;
        }

        /* ── Section title ─────────────────────────────────────────── */
        .section-title {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            letter-spacing: -0.035em;
            margin-bottom: 0.75rem;
            text-align: center;
            color: var(--ink-strong);
            line-height: 1.1;
        }

        .section-lead {
            text-align: center;
            color: var(--ink-dim);
            max-width: 62ch;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ── Screens ───────────────────────────────────────────────── */
        .screens {
            padding: 4.5rem 0;
            border-bottom: 1px solid var(--rule);
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
            margin-top: 3rem;
            align-items: end;
        }

        .screens-grid--single { grid-template-columns: 1fr; }

        .shot { margin: 0; }

        /* Mac- und iPhone-Mockups bringen ihren Schatten selbst mit; ein
           zusätzlicher CSS-Schatten legte einen zweiten Halo darüber. */
        .shot img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Hand-held shots are sized by height, not width — matched on width
           an iPhone would tower over an iPad. */
        .shot--phone img,
        .shot--tablet img {
            width: auto;
            max-width: 100%;
            margin: 0 auto;
        }

        /* Die Höhen gelten für das Bild samt Schattenrand: das iPhone-Mockup
           bringt seinen eigenen, weit auslaufenden Schatten mit (Gerät = 77 %
           der Bildhöhe), das iPad-Mockup gar keinen (Gerät = 100 %). Beide
           Geräte erscheinen damit gleich groß wie zuvor. */
        .shot--phone img  { max-height: 680px; }

        /* Einziges Mockup ohne eigenen Schatten — hier setzt ihn die Seite,
           in derselben Richtung wie die gerenderten Schatten der anderen. */
        .shot--tablet img {
            max-height: 620px;
            filter: drop-shadow(-8px 26px 44px rgba(51, 36, 28, 0.20));
        }

        .shot figcaption {
            margin-top: 1.5rem;
            color: var(--ink-dim);
            font-size: 0.9rem;
            line-height: 1.6;
            text-align: center;
            max-width: 46ch;
            margin-inline: auto;
        }

        .shot figcaption b {
            display: block;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-deep);
            margin-bottom: 0.4rem;
        }

        /* ── Features ──────────────────────────────────────────────── */
        .features {
            padding: 4.5rem 0;
            border-bottom: 1px solid var(--rule);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .feature-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            text-align: left;
            transition: transform 0.3s var(--ease, cubic-bezier(0.22, 1, 0.36, 1)),
                        box-shadow 0.3s ease, border-color 0.3s ease;
            border: 1px solid var(--rule);
            box-shadow: var(--shadow-card);
        }

        .feature-card:hover {
            transform: translateY(-4px);
            border-color: rgba(201, 111, 74, 0.32);
            box-shadow: var(--shadow-pop);
        }

        .feature-icon {
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
            display: inline-flex;
            width: 48px; height: 48px;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: var(--accent-tint);
            border: 1px solid rgba(201, 111, 74, 0.22);
        }

        .feature-title {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 1.0625rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: var(--ink-strong);
        }

        .feature-description {
            color: var(--ink-dim);
            line-height: 1.7;
            font-size: 0.9rem;
        }

        /* ── Process ───────────────────────────────────────────────── */
        .process {
            padding: 4.5rem 0;
            border-bottom: 1px solid var(--rule);
        }

        .process-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2.5rem 2rem;
            margin-top: 3rem;
        }

        .process-step {
            text-align: left;
            padding-top: 1.25rem;
            border-top: 2px solid var(--rule);
        }

        .step-number {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 0.85rem;
        }

        .step-title {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 1.0625rem;
            margin-bottom: 0.75rem;
            color: var(--ink-strong);
            letter-spacing: -0.02em;
        }

        .step-description {
            color: var(--ink-dim);
            line-height: 1.7;
            font-size: 0.9rem;
        }

        /* ── Impact ────────────────────────────────────────────────── */
        .impact {
            padding: 4.5rem 0;
            border-bottom: 1px solid var(--rule);
        }

        .impact-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .impact-stat {
            text-align: left;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--rule);
            box-shadow: var(--shadow-card);
        }

        .impact-number {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            letter-spacing: -0.045em;
            line-height: 1;
        }

        .impact-label {
            color: var(--ink-dim);
            font-weight: 500;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ── CTA ───────────────────────────────────────────────────── */
        .cta {
            padding: 5rem 0 6rem;
            text-align: center;
        }

        .cta-title {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 2.75rem);
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            color: var(--ink-strong);
        }

        .cta-description {
            color: var(--ink-dim);
            margin-bottom: 2.5rem;
            max-width: 62ch;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.9rem 1.6rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8125rem;
            letter-spacing: 0.04em;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
            transform: translateY(-2px);
            box-shadow: 0 16px 40px -12px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--ink);
            border-color: var(--rule-strong);
        }
        .btn-secondary:hover {
            background: var(--ink-strong);
            color: var(--bg);
            border-color: var(--ink-strong);
            transform: translateY(-2px);
        }

        /* ── Mobile ────────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .info-grid { grid-template-columns: 1fr; gap: 2rem; }
            .screens-grid { grid-template-columns: 1fr; gap: 3rem; }
        }

        @media (max-width: 768px) {
            .hero { padding: 3rem 0 2rem; }
            .hero-meta { gap: 1rem 1.25rem; }
            .features-grid { grid-template-columns: 1fr; }
            .process-steps { grid-template-columns: 1fr; }
            .impact-stats { grid-template-columns: repeat(2, 1fr); }
            .cta-buttons { flex-direction: column; align-items: center; }
            .container { padding: 0 1.25rem; }
        }
    </style>
